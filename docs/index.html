<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vagueborders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 class="wordmark"><b>vague</b>borders</h1>
  </header>

  <main class="stage">
    <div class="yearbox"><div class="year" id="year"></div></div>
    <svg id="map" role="img" aria-label="Map of human polities"></svg>
    <div class="legend" id="legend"></div>
    <div class="tooltip" id="tooltip" hidden></div>
  </main>

  <!-- Temporary: a plain year picker until the Phase 4 slider replaces it. -->
  <div class="controls">
    <label>snapshot <select id="year-select"></select></label>
  </div>

  <footer>all borders approximate. some borders imaginary.</footer>

  <script src="vendor/d3.v7.min.js"></script>
  <script src="vendor/topojson-client.v3.min.js"></script>
  <script src="map.js"></script>
</body>
</html>
